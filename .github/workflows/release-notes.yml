name: Release notes checks

on:
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - 'src/maplescouter-en-fix.user.js'
      - 'scripts/release-notes.mjs'
      - 'scripts/prepare-store-release.py'
      - 'test/release-notes.test.mjs'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'src/maplescouter-en-fix.user.js'
      - 'scripts/release-notes.mjs'
      - 'scripts/prepare-store-release.py'
      - 'test/release-notes.test.mjs'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Test release notes and existing regressions
        run: node --test test/*.test.*
      - name: Check current version and show its changes
        run: node scripts/release-notes.mjs
